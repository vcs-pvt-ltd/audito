# Pull request checks for Dev and main. Needs no secrets: backend tests stub
# the database, and the frontend build uses the built-in local API defaults
# from src/lib/apiConfig.ts (no NEXT_PUBLIC_* variables required).
name: CI

on:
  pull_request:
    branches: [Dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Syntax check (node --check)
        run: git ls-files 'src/**/*.js' 'src/*.js' 'scripts/*.js' | xargs -n1 node --check
      - name: Tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # next-env.d.ts (image module types) is gitignored and generated by Next;
      # without it tsc reports TS2307 for every .png import.
      - name: Generate Next types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      # Lint is non-blocking: `npm run lint` becomes `eslint .` with Platform &
      # Release's fix (claude/platform-lint-fix-467096; until it reaches Dev the
      # old `next lint` script fails). The baseline has 400 errors in existing
      # code; drop continue-on-error once the owning threads have cleared them.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint
      - name: Tests
        # frontend/package.json has no "test" script yet; run it once one exists.
        run: |
          if npm pkg get scripts.test | grep -qv '{}'; then npm test; else echo "No frontend test script yet, skipping."; fi
      - name: Build (static export)
        run: npm run build
