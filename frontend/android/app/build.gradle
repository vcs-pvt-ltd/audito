apply plugin: 'com.android.application'

// ── Audito Auditor release settings ──────────────────────────────────────
// PLACEHOLDER_APP_ID is provisional and must be replaced before any release
// (here, in namespace/applicationId below, in capacitor.config.ts and the
// MainActivity package). Release builds stop while it is still in use.
def PLACEHOLDER_APP_ID = "com.company.audito"

// Release signing values come from a properties file kept OUTSIDE the
// repository (storeFile, storePassword, keyAlias, keyPassword). Point to it with
// the AUDITO_ANDROID_SIGNING_PROPERTIES environment variable or
// -PauditoSigningProperties=<path>. See README "Audito Auditor Android App".
def signingPropsPath = System.getenv("AUDITO_ANDROID_SIGNING_PROPERTIES") ?: (project.findProperty("auditoSigningProperties") ?: "")
def signingProps = new Properties()
if (signingPropsPath && file(signingPropsPath).exists()) {
    file(signingPropsPath).withInputStream { signingProps.load(it) }
}

android {
    namespace = "com.company.audito"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.company.audito"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode must increase with every build given to users (-PauditoVersionCode=2, 3, ...).
        versionCode((project.findProperty("auditoVersionCode") ?: "1") as int)
        versionName(project.findProperty("auditoVersionName") ?: "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (!signingProps.isEmpty()) {
                storeFile file(signingProps.getProperty("storeFile"))
                storePassword signingProps.getProperty("storePassword")
                keyAlias signingProps.getProperty("keyAlias")
                keyPassword signingProps.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (!signingProps.isEmpty()) signingConfig signingConfigs.release
        }
    }
}

// Release builds need the permanent app ID, signing, and the owner's explicit
// confirmation (-PauditoReleaseConfirmed=true) that the production API URL,
// signing owner and release destination are agreed.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains("release") }
    if (!releasing) return
    def problems = []
    if (android.defaultConfig.applicationId == PLACEHOLDER_APP_ID) problems << "the application ID is still the placeholder ${PLACEHOLDER_APP_ID}"
    if (signingProps.isEmpty()) problems << "no signing properties (set AUDITO_ANDROID_SIGNING_PROPERTIES to a file outside the repository)"
    if (project.findProperty("auditoReleaseConfirmed") != "true") problems << "release not confirmed (-PauditoReleaseConfirmed=true after the production API, signing owner and destination are agreed)"
    if (!problems.isEmpty()) throw new GradleException("Audito Auditor release build refused: " + problems.join("; "))
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
